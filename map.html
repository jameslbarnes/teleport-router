<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Map · Router</title>
  <meta name="description" content="A private group's shared map of a field: what is established, what is emerging, what is still open, and what members found at each place.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/router.css?v=1">
  <style>
    /* Layout this page adds. Colours, type and components come from router.css. */
    .map-page { max-width: 1600px; }
    .map-head { margin-bottom: var(--s-4); }
    .map-head .r-h1 { margin-bottom: var(--s-2); }
    .tally { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-4); margin: 0 0 var(--s-4); font-family: var(--font-ui); font-size: var(--t-sm); color: var(--fg-muted); }
    .filters { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: 0 0 var(--s-5); }
    .filters button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .stages { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 1fr); gap: var(--s-4); overflow-x: auto; padding-bottom: var(--s-4); align-items: start; }
    .stage > h2 { font-family: var(--font-read); font-size: var(--t-h3); font-weight: 500; line-height: 1.25; margin: 0 0 var(--s-2); padding-bottom: var(--s-2); border-bottom: 1px solid var(--border); }
    .stage .stage-note { margin: 0 0 var(--s-3); font-size: var(--t-xs); color: var(--fg-muted); line-height: 1.45; }
    .group-label { margin: var(--s-4) 0 var(--s-2); font-family: var(--font-ui); font-size: var(--t-xs); font-weight: 600; letter-spacing: 0.02em; color: var(--fg-muted); }
    .place { display: block; width: 100%; margin: 0 0 var(--s-2); padding: var(--s-3); text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); cursor: pointer; }
    .place:hover { border-color: var(--border-strong); }
    .place:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
    .place[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .place[data-status="established"] { background: repeating-linear-gradient(135deg, var(--surface) 0 7px, var(--surface-sunk) 7px 8px); }
    .place[data-status="emerging"] { border-left: 3px solid var(--accent); }
    .place[data-status="open"] { background: var(--surface-sunk); border-style: dashed; }
    .place[data-status="open"] .place-label { color: var(--fg-muted); }
    .place-label { display: block; font-family: var(--font-read); font-size: var(--t-base); line-height: 1.3; }
    .place-status { display: block; margin-top: var(--s-1); font-family: var(--font-ui); font-size: var(--t-xs); color: var(--fg-muted); }
    .badges { display: flex; flex-wrap: wrap; gap: var(--s-1); margin-top: var(--s-2); }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-family: var(--font-mono); font-size: var(--t-xs); line-height: 1.6; background: var(--accent-soft); color: var(--accent); }
    .badge--failed { background: var(--danger-soft); color: var(--danger); }
    .badge--board { background: var(--success-soft); color: var(--success); }
    .badge--quiet { background: var(--surface-sunk); color: var(--fg-muted); }
    .legend { display: flex; flex-wrap: wrap; gap: var(--s-3) var(--s-5); margin: var(--s-5) 0 0; font-family: var(--font-ui); font-size: var(--t-xs); color: var(--fg-muted); }
    .legend .swatch { display: inline-block; width: 22px; height: 14px; margin-right: var(--s-2); vertical-align: -2px; border: 1px solid var(--border); border-radius: 3px; }
    .swatch[data-status="established"] { background: repeating-linear-gradient(135deg, var(--surface) 0 4px, var(--surface-sunk) 4px 5px); }
    .swatch[data-status="emerging"] { background: var(--surface); border-left: 3px solid var(--accent); }
    .swatch[data-status="open"] { background: var(--surface-sunk); border-style: dashed; }
    .detail { margin: 0 0 var(--s-5); }
    .detail h2 { margin-top: 0; }
    .detail .crumbs { font-family: var(--font-ui); font-size: var(--t-xs); color: var(--fg-muted); margin: 0 0 var(--s-2); }
    .marks { list-style: none; padding: 0; margin: var(--s-3) 0 0; }
    .marks li { padding: var(--s-3) 0; border-top: 1px solid var(--border); }
    .marks .who { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--fg-muted); }
    .marks .what { display: block; margin-top: var(--s-1); }
    @media (max-width: 720px) {
      .stages { grid-auto-flow: row; grid-auto-columns: auto; overflow-x: visible; }
    }
  </style>
</head>
<body>
<main class="r-page map-page">
  <header class="r-header">
    <a class="r-brand" href="/">Router</a>
  </header>

  <div id="message" class="r-notice" hidden></div>

  <div id="maps"></div>

  <noscript><p class="r-notice">This page needs JavaScript to draw the map.</p></noscript>
</main>
<script src="/map.js?v=1"></script>
</body>
</html>
