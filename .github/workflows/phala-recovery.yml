name: Router Discord test credential setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Encrypt model credential for Tulip
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECIPIENT_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEApkmL4gNOKsf/9Pst6MPB
            0WAhi3gpIfAlOO8yXyh2Lt2Tu+hKQOudzRf1KpUgLxQPbB5nXpVxt4dPnH1m4dig
            SKymr8WOwEZchiuPP8Kaedel2rbkaPpNNNipMMVUxf0yrtb/8Gu896rHARpfcBEk
            XRsmSi6RsCBeLhIO5wHI3RzeJtGgvmOW03GWNsqMN/vLCeEHY+tB18wXEhi08wCa
            aYgnvIb+92mfRrwqVYABZVtT1jVcc298KOk9Gk9VQwaLKH1Enmr0TEC6pXzzMgSU
            XhzlUgHJlsjDD4JPaY2P2yVHfcwbrdJ0s3EultDxBReW8rgYk85is624DaKwp/vG
            Tfj2I8SY3teg43d92jbgtbGhadU5Q+BnF1kZ+dTiYCvC3EdzKj2xyj91b/26Qnqa
            yDIfjDJr5CDZdiMR7V9c4j7NI3zuR+GFcQc3Ls3iSQ9WBM6mElYNgF90KOlOSxlZ
            vR2RdLQFIigQruLz96aau2+VbeiqXPkxCpKtwkKlSTFz0DNavfuVmKEdNbLGi2v7
            c6utEz2A2Ubl4YzGhZmW2CJ1EkuCelBPUmwRD48kuDF40+58EjnzpbCEkwwvrJk5
            ikcOD0/6f36IomifkZpk40pq2buAVYunJDVbvM3m7sl70mTGo1QZaLou/jIxuKm7
            jr27jcKWKvlLvjITmgCxQ3MCAwEAAQ==
            -----END PUBLIC KEY-----
        run: |
          node --input-type=module <<'NODE'
          import { publicEncrypt, constants } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const secret = process.env.ANTHROPIC_API_KEY;
          if (!secret || secret.length < 20) throw new Error('Required model credential is missing');
          const encrypted = publicEncrypt({key:process.env.RECIPIENT_KEY, padding:constants.RSA_PKCS1_OAEP_PADDING, oaepHash:'sha256'}, Buffer.from(secret));
          writeFileSync('provider-key.enc', encrypted);
          console.log('Encrypted model credential prepared for the test runtime.');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: router-discord-provider-key
          path: provider-key.enc
          retention-days: 1
          if-no-files-found: error
