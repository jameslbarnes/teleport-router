# The insights enclave: its own CVM, separate from Router, so Router's deploys never reach the release key.
# Deploy it as its own Phala app; never add it to Router's compose. Everything here is measured into the
# compose hash that owners' clients check, so settings that matter (key source, model, network) are plain
# values here. The deploy workflow (insights-enclave.yml) fills in __IMAGE_DIGEST__ and __GIT_SHA__ for the
# build being deployed.
#
# Two containers:
#   insights-enclave  the program. It holds the release key and opens traces. It is on the `sealed` network
#                     only, which has no route to the internet, and it has no model key. Its image holds one
#                     bundled file built from a handful of sources (insights-enclave/Dockerfile).
#   gate              the only way in or out. A stock Node image pinned by digest running insights-enclave/gate.mjs,
#                     embedded below. It passes the enclave's own requests in, and one kind of request out.
services:
  insights-enclave:
    image: docker.io/generalsemantics/teleport-router-insights-enclave@sha256:__IMAGE_DIGEST__
    command: ["node", "insights-enclave.mjs"]
    environment:
      - PORT=3100
      - NODE_ENV=production
      - INSIGHTS_KEY_SOURCE=dstack
      - INSIGHTS_MODEL=claude-sonnet-5-5
      - INSIGHTS_MODEL_URL=http://gate:8089
      # Where the weekly pipeline remembers its weeks, so a restart cannot make a week run twice.
      - INSIGHTS_STATE_FILE=/data/weekly.json
      - GIT_SHA=__GIT_SHA__
      - IMAGE_DIGEST=sha256:__IMAGE_DIGEST__
      # Name only: the value comes from Phala's encrypted environment at deploy time.
      - INSIGHTS_LINK_SECRET
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - insights-state:/data
    networks:
      - sealed
    restart: unless-stopped

  # BEGIN gate: generated by `node insights-enclave/embed.mjs`. Do not edit by hand.
  # The only container with a route out. It passes the enclave's own requests in, and one kind of
  # request out: a message to the model named below. See insights-enclave/gate.mjs.
  gate:
    image: docker.io/library/node:22-alpine@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    command:
      - node
      - --input-type=module
      - -e
      - "import('data:text/javascript;base64,')"
    environment:
      - INSIGHTS_GATE=run
      - INSIGHTS_MODEL=claude-sonnet-5-5
      - APP_URL=http://insights-enclave:3100
      - IN_PORT=3100
      - OUT_PORT=8089
      # Name only: the value comes from Phala's encrypted environment at deploy time.
      - ANTHROPIC_API_KEY
    ports:
      - "3100:3100"
    networks:
      - sealed
      - default
    restart: unless-stopped
  # END gate

volumes:
  insights-state:

networks:
  # No route out of the CVM: containers on this network can reach only each other.
  sealed:
    internal: true
