version: '3.8'

services:
  router:
    image: docker.io/generalsemantics/teleport-router:${GIT_SHA}@${IMAGE_DIGEST}
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TINYCLOUD_AUTHORS=tinycloud
      - TINYCLOUD_KEY_SOURCE=dstack
      - TINYCLOUD_HOST=https://tee.node.tinycloud.xyz
      - STAGING_DELAY_MS=3600000
      - GIT_SHA=${GIT_SHA}
      - IMAGE_DIGEST=${IMAGE_DIGEST}
      - MODERATOR_HANDLES=router,router_agent,james,socrates1024
      # Names only — values injected via encrypted --env-file at deploy time
      - BASE_URL
      - FIREBASE_SERVICE_ACCOUNT_BASE64
      - ANTHROPIC_API_KEY
      # Router checks the private conversation audience directly with Discord.
      - DISCORD_BOT_TOKEN
      - MODERATOR_URL=https://8f20c29f45571bade4b63d0f704faa926af53e7c-3000.dstack-pha-prod5.phala.network
      - MODERATOR_API_KEY
      - SENDGRID_API_KEY
      - SENDGRID_FROM_EMAIL
    volumes:
      - router-data:/data
      - /var/run/dstack.sock:/var/run/dstack.sock
    restart: unless-stopped

  shape-matrix-bridge:
    image: docker.io/generalsemantics/teleport-router:${GIT_SHA}@${IMAGE_DIGEST}
    command: ["node", "dist/shape-matrix-bridge.js"]
    ports:
      - "8092:8092"
    environment:
      # Matrix is intentionally hosted by this bridge process, not by the
      # public Router server. Notebook reads/writes go to the private Shape
      # Router instance below.
      - SHAPE_ROUTER_BASE_URL=https://shaperotator.teleport.computer
      - SHAPE_ROUTER_SECRET_KEY
      - SHAPE_MATRIX_BRIDGE_TAGS=shape-rotator,matrix
      - SHAPE_MATRIX_PUBLISH_IMMEDIATELY=1
      - SHAPE_MATRIX_ENABLE_ONBOARDING=0
      - SHAPE_MATRIX_AGENT_URL=http://router-agent:8091/matrix/event
      - SHAPE_MATRIX_AGENT_SECRET
      - SHAPE_MATRIX_SERVICE_PORT=8092
      - SHAPE_MATRIX_SERVICE_KEY
      - SHAPE_MATRIX_STARTUP_EVENT_GRACE_MS=5000
      - ANTHROPIC_API_KEY
      - MATRIX_SERVER_URL=https://mtrx.shaperotator.xyz
      - MATRIX_SERVER_NAME=mtrx.shaperotator.xyz
      - MATRIX_BOT_SECRET_KEY
      - MATRIX_ACCESS_TOKEN
      - MATRIX_USER_ID
      - MATRIX_DEVICE_ID
      - MATRIX_CRYPTO_SECRET
      - MATRIX_CLEANUP_ORPHAN_DEVICES=0
      - MATRIX_BOT_HANDLE
      - MATRIX_SPACE_ROOM_ID=!4FL8uL5OEYLATG1VH4wC2CD3pfIV6BMFId9VT7rmm-g
      - MATRIX_REGISTRATION_TOKEN
      - MATRIX_SIGNUP_URL=https://mtrx.shaperotator.xyz/signup/api
    volumes:
      - shape-matrix-bridge-data:/data
    depends_on:
      - router-agent
    restart: unless-stopped

  router-agent:
    image: docker.io/generalsemantics/teleport-router-agent:${GIT_SHA}@${AGENT_IMAGE_DIGEST}
    environment:
      # Repurposed for Shape Router in this CVM. Matrix/E2EE transport stays in
      # shape-matrix-bridge; Hermes uses the private Shape Router MCP key.
      - ANTHROPIC_API_KEY
      - ROUTER_MCP_URL=https://shaperotator.teleport.computer/mcp/
      - SHAPE_ROUTER_SECRET_KEY
      - ROUTER_HANDLE=router
      - ROUTER_ENABLE_GATEWAY=0
      - ROUTER_AGENT_HTTP_MODE=1
      - ROUTER_AGENT_HTTP_PORT=8091
      - SHAPE_MATRIX_AGENT_SECRET
      - TELEGRAM_BOT_TOKEN
      - GITHUB_TOKEN
    volumes:
      - router-data:/data
    depends_on:
      - router
    restart: unless-stopped

  discord-bot:
    image: docker.io/generalsemantics/teleport-router-discord:${GIT_SHA}@${DISCORD_IMAGE_DIGEST}
    user: "10000:10000"
    init: true
    read_only: true
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      # Distinct identities from Router/Shape, and never James's personal key.
      - DISCORD_BOT_TOKEN
      - DISCORD_MODEL_API_KEY
      - DISCORD_PUBLIC_ROUTER_KEY
      - DISCORD_PRIVATE_ROUTER_KEY
      - DISCORD_INITIAL_LINKS_B64
    volumes:
      - discord-data:/data
    # Outbound Discord gateway only: no ports, Docker socket or dstack socket.
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/python", "-I", "/opt/router-discord/health.py"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped

  dstack-ingress:
    image: dstacktee/dstack-ingress:20250929@sha256:2b47b3e538df0b3e7724255b89369194c8c83a7cfba64d2faf0115ad0a586458
    # Stale hermes.teleport.computer certbot state in this volume makes every
    # `certbot renew` exit nonzero (hermes CAA pins the other ingress's ACME
    # account), which blocks nginx from starting/reloading. Purge it first.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        rm -rf /etc/letsencrypt/renewal/hermes.teleport.computer.conf
        /etc/letsencrypt/live/hermes.teleport.computer
        /etc/letsencrypt/archive/hermes.teleport.computer
        && exec /scripts/entrypoint.sh "$$@"
      - --
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "443:443"
    environment:
      - DOMAIN=router.teleport.computer
      - DNS_PROVIDER=cloudflare
      - CLOUDFLARE_API_TOKEN
      - GATEWAY_DOMAIN=_.dstack-pha-prod9.phala.network
      - CERTBOT_EMAIL=james@generalsemantics.nyc
      - SET_CAA=true
      - TARGET_ENDPOINT=http://router:3000
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data-cf:/etc/letsencrypt
    depends_on:
      - router
    restart: unless-stopped

  hermes-ingress:
    image: dstacktee/dstack-ingress:20250929@sha256:2b47b3e538df0b3e7724255b89369194c8c83a7cfba64d2faf0115ad0a586458
    ports:
      - "444:444"
    environment:
      - DOMAIN=hermes.teleport.computer
      - DNS_PROVIDER=cloudflare
      - CLOUDFLARE_API_TOKEN
      - GATEWAY_DOMAIN=_.dstack-pha-prod9.phala.network
      - CERTBOT_EMAIL=james@generalsemantics.nyc
      - SET_CAA=true
      - TARGET_ENDPOINT=http://router:3000
      - PORT=444
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - hermes-cert-data-cf:/etc/letsencrypt
    depends_on:
      - router
    restart: unless-stopped

volumes:
  router-data:
  shape-matrix-bridge-data:
  discord-data:
  cert-data-cf:
  hermes-cert-data-cf:
