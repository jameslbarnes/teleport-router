name: Encrypted read-only author inventory
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        default: status
        options: [status]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: server
      - run: node scripts/encryption-inventory.mjs
        working-directory: server
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-author-inventory
          path: ${{ runner.temp }}/author-inventory.enc.json
          retention-days: 2
