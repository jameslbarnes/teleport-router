name: Build and Push Docker Image

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Phala after build'
        required: true
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: generalsemantics/teleport-router
  AGENT_IMAGE_NAME: generalsemantics/teleport-router-agent
  DISCORD_IMAGE_NAME: generalsemantics/teleport-router-discord

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      agent_digest: ${{ steps.agent_build.outputs.digest }}
      agent_tags: ${{ steps.agent_meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Test private Discord commands
        run: |
          python3 -m venv "$RUNNER_TEMP/router-discord-tests"
          "$RUNNER_TEMP/router-discord-tests/bin/pip" install --disable-pip-version-check discord.py==2.7.1
          "$RUNNER_TEMP/router-discord-tests/bin/python" -m unittest discover -s agent/discord-test/router-private -p 'test_*.py'
          node --test server/scripts/link-discord-group.test.mjs

      - name: Check native sharing-card adapter
        working-directory: adapters/paseo-sharing-card
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test

      - name: Test independent uptime monitor
        run: node --test scripts/monitor-router.test.mjs

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Verify graceful staging recovery
        working-directory: server
        run: node scripts/staging-recovery-smoke.mjs

      - name: Verify Shape Matrix bridge artifact
        run: test -f server/dist/shape-matrix-bridge.js

      - name: Validate compose topology
        env:
          GIT_SHA: ci
          IMAGE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AGENT_IMAGE_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: node scripts/shape-compose-boundary-check.mjs

      - name: Validate agent Matrix boundary
        run: node scripts/shape-agent-boundary-check.mjs

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Extract agent metadata
        id: agent_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build and push agent
        id: agent_build
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.agent_meta.outputs.tags }}
          labels: ${{ steps.agent_meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      - name: Output digest
        run: |
          echo "## Docker Image Attestation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Agent Image:** \`${{ env.AGENT_IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Agent Digest:** \`${{ steps.agent_build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Git SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification" >> $GITHUB_STEP_SUMMARY
          echo "To verify the Phala TEE attestation matches this build:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# 1. Get attestation from Phala dashboard or /attestation endpoint" >> $GITHUB_STEP_SUMMARY
          echo "# 2. Compare the image digests in vm_config with:" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.agent_build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  group-onboarding:
    # This pinned browser release supports Ubuntu 24.04, not ubuntu-latest's 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Check group onboarding in a browser
        working-directory: server
        run: |
          npm run build
          npm --prefix ../browser ci
          npm --prefix ../browser run build
          npm --prefix ../browser test
          npm install --prefix "$RUNNER_TEMP/router-browser" --ignore-scripts --no-audit --no-fund playwright@1.59.1
          node "$RUNNER_TEMP/router-browser/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="file://$RUNNER_TEMP/router-browser/node_modules/playwright/index.mjs" node scripts/untrusted-content-browser-smoke.mjs
          PLAYWRIGHT_MODULE="file://$RUNNER_TEMP/router-browser/node_modules/playwright/index.mjs" node scripts/group-onboarding-browser-smoke.mjs
          PLAYWRIGHT_MODULE="file://$RUNNER_TEMP/router-browser/node_modules/playwright/index.mjs" node scripts/group-setup-live-smoke.mjs

  discord-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Discord service boundaries
        run: node scripts/discord-compose-check.mjs
      - name: Build exact Discord runtime for testing
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/discord-phala/Dockerfile
          load: true
          tags: router-discord:ci
          cache-from: type=gha,scope=discord
          cache-to: type=gha,scope=discord,mode=max
      - name: Test both plugins and portable source reader in the shipped runtime
        run: |
          for suite in router-private router-participation; do
            docker run --rm --network none --memory 512m --memory-swap 512m --cpus 1 \
              --read-only --tmpfs /tmp:rw,size=64m,mode=1777 -v "$PWD:/checks:ro" \
              --entrypoint /opt/hermes/.venv/bin/python router-discord:ci \
              -m unittest discover -s "/checks/agent/discord-test/$suite" -p 'test_*.py'
          done
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 1 \
            --read-only --tmpfs /tmp:rw,size=64m,mode=1777 -v "$PWD:/checks:ro" \
            --entrypoint /opt/hermes/.venv/bin/python router-discord:ci \
            -m unittest discover -s /checks/agent/discord-phala -p 'test_*.py'
      - name: Start the actual gateway offline under production limits
        run: python3 scripts/discord-container-smoke.py
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested Discord image
        id: publish
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          export PUBLISH_REF="docker.io/${DISCORD_IMAGE_NAME}:${GITHUB_SHA:0:7}"
          docker tag router-discord:ci "$PUBLISH_REF"
          docker push "$PUBLISH_REF"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const inspect = ref => JSON.parse(execFileSync('docker', ['image', 'inspect', ref], {encoding: 'utf8'}))[0];
          const tested = inspect('router-discord:ci');
          const published = inspect(process.env.PUBLISH_REF);
          assert.equal(published.Id, tested.Id, 'Publish the exact tested image, without rebuilding');
          const ref = published.RepoDigests.find(r => r.startsWith(`${process.env.DISCORD_IMAGE_NAME}@`) || r.startsWith(`docker.io/${process.env.DISCORD_IMAGE_NAME}@`));
          const digest = ref?.split('@')[1];
          assert.match(digest || '', /^sha256:[a-f0-9]{64}$/);
          appendFileSync(process.env.GITHUB_OUTPUT, `digest=${digest}\n`);
          console.log(`Published tested Discord image: ${digest}`);
          NODE

  deploy:
    needs: [build, discord-image, group-onboarding]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    runs-on: ubuntu-latest
    concurrency:
      group: production-phala-deploy
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Phala CLI
        # Pinned: phala 1.1.20 fails against this CVM with
        # "CVM encrypted_env_pubkey is required for centralized KMS"
        run: npm install -g phala@1.1.19

      - name: Generate compose file
        env:
          GIT_SHA_FULL: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          AGENT_IMAGE_DIGEST: ${{ needs.build.outputs.agent_digest }}
          DISCORD_IMAGE_DIGEST: ${{ needs.discord-image.outputs.digest }}
        run: |
          # Only non-secret values go into the compose (visible in TEE metadata)
          export GIT_SHA=$(echo "$GIT_SHA_FULL" | cut -c1-7)
          envsubst < docker-compose.template.yml > docker-compose.deploy.yml
          cat docker-compose.deploy.yml

      - name: Generate Phala env file
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HERMES_AGENT_SECRET_KEY: ${{ secrets.HERMES_AGENT_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEAR_AI_API_KEY: ${{ secrets.NEAR_AI_API_KEY }}
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          NAMECHEAP_CLIENT_IP: ${{ secrets.NAMECHEAP_CLIENT_IP }}
          ROUTER_AGENT_GITHUB_TOKEN: ${{ secrets.ROUTER_AGENT_GITHUB_TOKEN }}
          SHAPE_ROUTER_SECRET_KEY: ${{ secrets.SHAPE_ROUTER_SECRET_KEY }}
          SHAPE_MATRIX_AGENT_SECRET: ${{ secrets.SHAPE_MATRIX_AGENT_SECRET }}
          SHAPE_MATRIX_SERVICE_KEY: ${{ secrets.SHAPE_MATRIX_SERVICE_KEY }}
          MATRIX_BOT_SECRET_KEY: ${{ secrets.MATRIX_BOT_SECRET_KEY }}
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          MATRIX_USER_ID: ${{ secrets.MATRIX_USER_ID }}
          MATRIX_DEVICE_ID: ${{ secrets.MATRIX_DEVICE_ID }}
          MATRIX_BOT_HANDLE: ${{ secrets.MATRIX_BOT_HANDLE }}
          MATRIX_REGISTRATION_TOKEN: ${{ secrets.MATRIX_REGISTRATION_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MODEL_API_KEY: ${{ secrets.DISCORD_MODEL_API_KEY }}
          DISCORD_PUBLIC_ROUTER_KEY: ${{ secrets.DISCORD_PUBLIC_ROUTER_KEY }}
          DISCORD_PRIVATE_ROUTER_KEY: ${{ secrets.DISCORD_PRIVATE_ROUTER_KEY }}
          DISCORD_INITIAL_LINKS_B64: ${{ secrets.DISCORD_INITIAL_LINKS_B64 }}
        run: |
          set -euo pipefail
          env_file=/tmp/phala.env
          : > "$env_file"
          chmod 600 "$env_file"

          write_env() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$env_file"
            fi
          }

          write_env BASE_URL
          write_env FIREBASE_SERVICE_ACCOUNT_BASE64
          write_env ANTHROPIC_API_KEY
          write_env SENDGRID_API_KEY
          write_env SENDGRID_FROM_EMAIL
          write_env CLOUDFLARE_API_TOKEN
          write_env HERMES_AGENT_SECRET_KEY
          write_env TELEGRAM_BOT_TOKEN
          write_env NEAR_AI_API_KEY
          write_env NAMECHEAP_API_KEY
          write_env NAMECHEAP_CLIENT_IP
          write_env SHAPE_ROUTER_SECRET_KEY
          write_env SHAPE_MATRIX_AGENT_SECRET
          write_env SHAPE_MATRIX_SERVICE_KEY
          write_env MATRIX_BOT_SECRET_KEY
          write_env MATRIX_ACCESS_TOKEN
          write_env MATRIX_USER_ID
          write_env MATRIX_DEVICE_ID
          write_env MATRIX_BOT_HANDLE
          write_env MATRIX_REGISTRATION_TOKEN
          write_env DISCORD_BOT_TOKEN
          write_env DISCORD_MODEL_API_KEY
          write_env DISCORD_PUBLIC_ROUTER_KEY
          write_env DISCORD_PRIVATE_ROUTER_KEY
          write_env DISCORD_INITIAL_LINKS_B64

          if [ -n "$HERMES_AGENT_SECRET_KEY" ]; then
            printf 'ROUTER_SECRET_KEY=%s\n' "$HERMES_AGENT_SECRET_KEY" >> "$env_file"
            printf 'HERMES_SECRET_KEY=%s\n' "$HERMES_AGENT_SECRET_KEY" >> "$env_file"
          fi
          if [ -n "$ROUTER_AGENT_GITHUB_TOKEN" ]; then
            printf 'GITHUB_TOKEN=%s\n' "$ROUTER_AGENT_GITHUB_TOKEN" >> "$env_file"
          fi
          if [ -n "$MATRIX_BOT_SECRET_KEY" ]; then
            printf 'MATRIX_CRYPTO_SECRET=%s\n' "$MATRIX_BOT_SECRET_KEY" >> "$env_file"
          fi

          for required in HERMES_AGENT_SECRET_KEY SHAPE_ROUTER_SECRET_KEY SHAPE_MATRIX_SERVICE_KEY MATRIX_BOT_SECRET_KEY MATRIX_REGISTRATION_TOKEN DISCORD_BOT_TOKEN DISCORD_MODEL_API_KEY DISCORD_PUBLIC_ROUTER_KEY DISCORD_PRIVATE_ROUTER_KEY DISCORD_INITIAL_LINKS_B64; do
            if ! grep -q "^${required}=." "$env_file"; then
              echo "Missing required Phala env: ${required}"
              exit 1
            fi
          done

          echo "Phala env file generated with $(wc -l < "$env_file") entries"

      - name: Log in to Docker Hub for deploy verification
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify generated deploy compose and image
        run: SHAPE_COMPOSE_PULL_IMAGE=1 node scripts/shape-compose-boundary-check.mjs --check-image docker-compose.deploy.yml

      - name: Deploy to Phala Cloud
        id: phala_deploy
        run: |
          set -euo pipefail
          # Compose-only deploy — encrypted env vars are set in Phala dashboard
          # and persist across deploys. CI only updates the image tag.
          # --no-public-logs: container logs stay private (the CLI defaults to public).
          for attempt in {1..20}; do
            echo "Phala deploy attempt ${attempt}/20"
            set +e
            phala deploy --wait --cvm-id ${{ secrets.PHALA_APP_ID }} -c docker-compose.deploy.yml -e /tmp/phala.env --no-public-logs 2>&1 | tee /tmp/phala-deploy.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if grep -q "Another operation is already in progress" /tmp/phala-deploy.log; then
              if [ "$attempt" -eq 20 ]; then
                echo "Phala deploy is still locked after ${attempt} attempts"
                exit "$status"
              fi
              echo "Phala reports an operation in progress; waiting 60s before retrying"
              sleep 60
              continue
            fi

            exit "$status"
          done
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_API_KEY }}

      - name: Cleanup
        if: always()
        run: rm -f docker-compose.deploy.yml /tmp/phala.env

      - name: Verify Phala deployment
        id: phala_verify
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_API_KEY }}
          PHALA_APP_ID: ${{ secrets.PHALA_APP_ID }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          EXPECTED_AGENT_IMAGE_DIGEST: ${{ needs.build.outputs.agent_digest }}
          EXPECTED_DISCORD_IMAGE_DIGEST: ${{ needs.discord-image.outputs.digest }}
        run: |
          set -euo pipefail
          export EXPECTED_GIT_SHA="$(echo "$EXPECTED_GIT_SHA" | cut -c1-7)"
          bash scripts/verify-phala-deploy.sh

      - name: Run deployed Shape Matrix DM smoke
        id: matrix_smoke
        if: ${{ !cancelled() && steps.phala_verify.outcome == 'success' }}
        env:
          SHAPE_ROUTER_SECRET_KEY: ${{ secrets.SHAPE_ROUTER_SECRET_KEY }}
          SHAPE_MATRIX_SMOKE_RUNNING_BRIDGE: '1'
          SHAPE_MATRIX_SMOKE_PROVISION_SENDER: '1'
          SHAPE_MATRIX_SMOKE_SENTINEL: shape-router-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          SHAPE_MATRIX_SMOKE_WORKDIR: /tmp/shape-matrix-live-smoke-${{ github.run_id }}
          MATRIX_SERVER_URL: https://mtrx.shaperotator.xyz
          MATRIX_SERVER_NAME: mtrx.shaperotator.xyz
          MATRIX_USER_ID: ${{ secrets.MATRIX_USER_ID }}
          MATRIX_BOT_HANDLE: ${{ secrets.MATRIX_BOT_HANDLE }}
          MATRIX_SMOKE_SENDER_ACCESS_TOKEN: ${{ secrets.MATRIX_SMOKE_SENDER_ACCESS_TOKEN }}
          MATRIX_SMOKE_SENDER_USER_ID: ${{ secrets.MATRIX_SMOKE_SENDER_USER_ID }}
          MATRIX_SMOKE_SENDER_DEVICE_ID: ${{ secrets.MATRIX_SMOKE_SENDER_DEVICE_ID }}
          MATRIX_SMOKE_SIGNUP_CODE: ${{ secrets.MATRIX_SMOKE_SIGNUP_CODE || secrets.MATRIX_REGISTRATION_TOKEN }}
        run: node scripts/shape-matrix-live-smoke.mjs

      - name: Verify live TinyCloud identity
        id: tinycloud_verify
        # Independent of Matrix signup/messaging; neither failure masks the other.
        # The job still fails if either check fails.
        if: ${{ !cancelled() && steps.phala_verify.outcome == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://router.teleport.computer/api/tinycloud/router', { signal: AbortSignal.timeout(20000) });
          assert(response.ok, 'TinyCloud identity endpoint must be live');
          const info = await response.json();
          assert.equal(info.mode, 'authors');
          assert.equal(info.keySource, 'dstack');
          assert.match(info.did, /^did:pkh:eip155:1:0x[0-9a-fA-F]{40}$/);
          assert.equal(info.folder, 'router/');
          console.log('Live TinyCloud identity:', info.did, '(dstack; per-author storage)');
          NODE

      # Evidence is archived whenever the deploy itself succeeded, even if a
      # later check failed, so the public record never silently stops.
      - name: Archive evidences
        if: always() && steps.phala_deploy.outcome == 'success'
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_API_KEY }}
          PHALA_APP_ID: ${{ secrets.PHALA_APP_ID }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          AGENT_IMAGE_DIGEST: ${{ needs.build.outputs.agent_digest }}
          DISCORD_IMAGE_DIGEST: ${{ needs.discord-image.outputs.digest }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/archive-tee-evidence.sh

      - name: Commit evidences to repo
        if: always() && steps.phala_deploy.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidences/
          if git diff --cached --quiet; then
            echo "No new evidences to commit"
          else
            git commit -m "chore: archive TEE evidences for $(date -u +%Y-%m-%d) deploy"
            git push
          fi

      - name: Deployment summary
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.phala_deploy.outcome }}
          PHALA_OUTCOME: ${{ steps.phala_verify.outcome }}
          MATRIX_OUTCOME: ${{ steps.matrix_smoke.outcome }}
          TINYCLOUD_OUTCOME: ${{ steps.tinycloud_verify.outcome }}
        run: |
          echo "## Phala TEE Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Outcome |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Phala deployment | $DEPLOY_OUTCOME |" >> $GITHUB_STEP_SUMMARY
          echo "| TEE metadata and health | $PHALA_OUTCOME |" >> $GITHUB_STEP_SUMMARY
          echo "| Shape Matrix messages | $MATRIX_OUTCOME |" >> $GITHUB_STEP_SUMMARY
          echo "| TinyCloud identity | $TINYCLOUD_OUTCOME |" >> $GITHUB_STEP_SUMMARY
          echo "**App ID:** \`${{ secrets.PHALA_APP_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image Digest:** \`${{ needs.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Agent Digest:** \`${{ needs.build.outputs.agent_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**KMS:** Pha (cloud) — Base on-chain KMS pending CVM recreation" >> $GITHUB_STEP_SUMMARY
          echo "**Evidences:** Archived to \`evidences/$(date -u +%Y-%m-%d)/\`" >> $GITHUB_STEP_SUMMARY
